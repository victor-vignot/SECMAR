[project]
name = "secmar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.10.23",
    "dash>=4.4.1",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "radon>=6.0.1",
    "ruff>=0.17.3",
]

[tool.uv]
# Les outils de developpement ne sont pas installes par un simple `uv sync`
# (machine d'evaluation) : on les active avec `--group dev`.
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Le plugin de test de Dash (non utilise ici) emet un avertissement pytest.
addopts = "-p no:dash"

# --- Outils de qualité (évaluation : ruff, pylint, mypy, radon) -------------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "N"]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
# Pandas, Plotly, Dash et Shapely ne publient pas d'annotations de types complètes.
ignore_missing_imports = true
warn_unused_ignores = true
# Toute fonction du projet doit déclarer les types de ses paramètres et de son retour.
disallow_untyped_defs = true
